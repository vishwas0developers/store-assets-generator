name: secret-scan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with: { fetch-depth: 0 }
      - name: install gitleaks (checksum verified)
        run: |
          V=8.30.1
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v$V/gitleaks_${V}_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_${V}_linux_x64.tar.gz" | sha256sum -c -
          tar xzf gitleaks_${V}_linux_x64.tar.gz gitleaks
      - name: scan new commits (blocks on any finding)
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          RANGE=""
          if [ -n "$BASE" ]; then RANGE="--log-opts=$BASE..$HEAD_SHA";
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then RANGE="--log-opts=$BEFORE..$HEAD_SHA"; fi
          ./gitleaks git . --redact=100 --no-banner --config .gitleaks.toml $RANGE
