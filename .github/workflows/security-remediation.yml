name: security-remediation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  credentials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - name: Install checksum-verified Gitleaks
        run: |
          set -eu
          V=8.30.1
          curl --fail --silent --show-error --location --output gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check -
          tar xzf gitleaks.tar.gz gitleaks
      - name: Scan introduced commits
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu
          START="${BASE:-${BEFORE:-}}"
          if [ -n "$START" ] && [ "$START" != '0000000000000000000000000000000000000000' ]; then
            git cat-file -e "$START^{commit}"
            ./gitleaks git . --redact=100 --no-banner --config .gitleaks.toml --log-opts="$START..$HEAD_SHA"
          else
            ./gitleaks git . --redact=100 --no-banner --config .gitleaks.toml --log-opts='--all'
          fi
      - name: Scan indexed databases and key files
        run: python3 security_audit/secret_scan_sqlite.py
