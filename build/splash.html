<!doctype html><meta charset="utf-8">
<style>
html,body{margin:0;height:100%;background:transparent;font-family:"Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
.card{box-sizing:border-box;height:100%;border-radius:20px;background:linear-gradient(160deg,#0f172a,#0b1220);border:1px solid #1e293b;
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#e2e8f0;-webkit-app-region:drag;padding:20px}
button{-webkit-app-region:no-drag}
img{width:96px;height:96px}
h1{margin:6px 0 0;font-size:20px;font-weight:600;letter-spacing:.3px}
#status{font-size:12.5px;color:#94a3b8;min-height:16px;text-align:center;padding:0 24px}
.bar{width:200px;height:3px;border-radius:3px;background:#1e293b;overflow:hidden}
.bar i{display:block;width:40%;height:100%;background:#22c55e;border-radius:3px;animation:s 1.1s ease-in-out infinite}
@keyframes s{0%{margin-left:-40%}100%{margin-left:100%}}
.err .bar{display:none}.err #status{color:#fca5a5}

/* setup mode */
#simple{display:contents}
#setup{display:none;width:100%;height:100%;flex-direction:column;gap:10px}
.setup #simple{display:none}.setup #setup{display:flex}
.head{display:flex;align-items:center;gap:12px}
.head img{width:44px;height:44px}
.head h2{margin:0;font-size:17px;font-weight:600}
.head p{margin:2px 0 0;font-size:12px;color:#94a3b8}
.total{height:4px;border-radius:4px;background:#1e293b;overflow:hidden}
.total i{display:block;height:100%;width:0;background:#22c55e;transition:width .3s}
#steps{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px;padding-right:2px}
.st{display:flex;gap:10px;align-items:flex-start;padding:5px 8px;border-radius:8px;font-size:13px;color:#64748b;transition:background .2s,color .2s}
.st .ic{width:18px;height:18px;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;border-radius:50%;border:1.5px solid #334155;box-sizing:border-box;margin-top:1px}
.st .tx{flex:1;min-width:0}
.st .dt{font-size:11.5px;color:#64748b;margin-top:1px;word-break:break-word}
.st.active{background:#111c33;color:#e2e8f0}.st.active .dt{color:#94a3b8}
.st.active .ic{border-color:#22c55e;border-top-color:transparent;animation:spin .8s linear infinite}
.st.done{color:#cbd5e1}.st.done .ic{background:#22c55e;border-color:#22c55e;color:#06210f}
.st.skipped{color:#64748b}.st.skipped .ic{border-style:dashed}
.st.failed{background:#2a1015;color:#fca5a5}.st.failed .ic{background:#ef4444;border-color:#ef4444;color:#fff}.st.failed .dt{color:#fca5a5}
@keyframes spin{to{transform:rotate(360deg)}}
.pb{height:5px;border-radius:5px;background:#1e293b;overflow:hidden;margin-top:5px}
.pb i{display:block;height:100%;width:0;background:#3b82f6;transition:width .15s}
.dl{font-size:11.5px;color:#94a3b8;margin-top:3px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.foot{display:flex;gap:8px;justify-content:flex-end;align-items:center;min-height:34px}
.foot .msg{flex:1;font-size:12px;color:#94a3b8}
.foot .msg.bad{color:#fca5a5}
.btn{border:0;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;background:#3b82f6;color:#fff}
.btn.sec{background:#1e293b;color:#cbd5e1}
</style>
<div class="card" id="c">
  <div id="simple">
    <img src="icon.png"><h1>Store Assets Generator</h1>
    <div class="bar"><i></i></div><div id="status">Starting...</div>
  </div>
  <div id="setup">
    <div class="head"><img src="icon.png"><div><h2>Setting up Store Assets Generator</h2><p id="sub">Preparing...</p></div></div>
    <div class="total"><i id="tot"></i></div>
    <div id="steps"></div>
    <div class="foot" id="foot"></div>
  </div>
</div>
<script>
var $=function(i){return document.getElementById(i)};
function setStatus(t,e,p){$('status').textContent=t;$('c').classList.toggle('err',!!e);
var i=document.querySelector('.bar i');if(typeof p==='number'){i.style.animation='none';i.style.marginLeft='0';i.style.width=p+'%'}else{i.style.cssText=''}}
function simple(){document.body.classList.remove('setup')}

var ICONS={done:'✓',failed:'✕',skipped:'–',pending:'',active:''};
var LBL={pending:'Pending',active:'In progress',done:'Completed',skipped:'Skipped',failed:'Failed'};
function sz(n){return n>=1073741824?(n/1073741824).toFixed(2)+' GB':(n/1048576).toFixed(1)+' MB'}
function tm(s){s=Math.round(s);return s>=60?Math.floor(s/60)+'m '+(s%60)+'s':s+'s'}
var built=false;
function setup(st){
  document.body.classList.add('setup');
  if(!st.steps){return}
  var box=$('steps');
  if(!built){box.innerHTML='';st.steps.forEach(function(s){var d=document.createElement('div');d.className='st';d.id='s-'+s.id;
    d.innerHTML='<div class="ic"></div><div class="tx"><div class="nm"></div><div class="dt"></div><div class="ex"></div></div>';box.appendChild(d)});built=true}
  var doneN=0;
  st.steps.forEach(function(s){
    var d=$('s-'+s.id);d.className='st '+s.status;
    d.querySelector('.ic').textContent=ICONS[s.status];
    d.querySelector('.nm').textContent=s.label+' — '+LBL[s.status];
    d.querySelector('.dt').textContent=s.detail||'';
    var ex=d.querySelector('.ex');ex.innerHTML='';
    if(s.status==='active'&&(s.dl||typeof s.progress==='number')){
      var p=typeof s.progress==='number'?s.progress:0;
      var h='<div class="pb"><i style="width:'+p+'%"></i></div>';
      if(s.dl){h+='<div class="dl"><span>'+s.dl.name+' · '+Math.round(p)+'%</span><span>'+sz(s.dl.done)+(s.dl.total?' / '+sz(s.dl.total):'')+'</span><span>'+sz(s.dl.speed)+'/s</span>'+(s.dl.eta?'<span>~'+tm(s.dl.eta)+' left</span>':'')+'</div>'}
      ex.innerHTML=h}
    if(s.status==='done'||s.status==='skipped')doneN++;
    if(s.status==='active'){var el=d;if(el.scrollIntoView)el.scrollIntoView({block:'nearest'})}
  });
  $('tot').style.width=Math.round(doneN/st.steps.length*100)+'%';
  var foot=$('foot');foot.innerHTML='';
  if(st.status==='running'){$('sub').textContent='Installing, configuring and verifying required components...'}
  if(st.status==='failed'){$('sub').textContent='Setup needs attention';
    foot.innerHTML='<span class="msg bad"></span>';foot.firstChild.textContent=st.error||'A step failed';
    var r=document.createElement('button');r.className='btn';r.textContent='Retry';r.onclick=function(){window.sag.action('retry')};
    var k=document.createElement('button');k.className='btn sec';k.textContent='Continue without';k.onclick=function(){window.sag.action('skip')};
    foot.appendChild(k);foot.appendChild(r)}
  if(st.status==='complete'){$('sub').textContent='Installation Complete';
    foot.innerHTML='<span class="msg">✓ All components installed · ✓ Dependencies verified · ✓ Configuration verified</span>';
    var l=document.createElement('button');l.className='btn';l.textContent='Launch Application';l.onclick=function(){window.sag.action('launch')};foot.appendChild(l)}
}
</script>
