repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--config", ".gitleaks.toml", "--redact"]

  - repo: local
    hooks:
      - id: sqlite-index-exclusion
        name: prevent SQLite databases and key files
        entry: python security_audit/secret_scan_sqlite.py --staged
        language: system
        always_run: true
        pass_filenames: false
